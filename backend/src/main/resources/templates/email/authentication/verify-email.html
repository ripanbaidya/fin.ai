<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Verify your email</title>
</head>
<body style="margin:0; padding:24px; font-family:Arial, sans-serif; background:#f8fafd; color:#202124;">
<div style="max-width:500px; margin:0 auto; background:#ffffff; padding:32px; border:1px solid #e8eaed; border-radius:8px;">

  <h2 style="margin:0 0 16px; font-size:20px;">Verify your email</h2>
  <p style="margin:0 0 20px; color:#5f6368; font-size:14px;">
    Hi <span th:text="${name}">there</span>, use this code to confirm your account.
  </p>

  <div style="background:#f8fafd; border:1px solid #e8eaed; border-radius:6px; padding:16px; text-align:center; margin-bottom:20px;">
    <span style="font-size:28px; font-weight:bold; letter-spacing:6px; color:#1967d2;" th:text="${otp}">123456</span>
  </div>

  <p style="margin:0 0 12px; color:#5f6368; font-size:13px;">
    Expires in <strong th:text="${validityMinutes}">5</strong> minutes.
  </p>
  <p style="margin:0; color:#80868b; font-size:12px;">
    If you didn't request this, ignore this email.
  </p>

</div>
</body>
</html>
